<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>زاجل</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --page:#e8edf1; --ink:#16202a; --muted:#5a6877; --surface:#ffffff; --surface2:#f1f4f7; --line:#dbe2e9;
  --tg:#2f8be6; --tg-ink:#ffffff; --chat:#cfe0d4; --bubble-me:#e2f6d3; --bubble:#ffffff;
  --zajel:#0d6b5b; --zajel-soft:#d8eee8; --warn:#9a5f0a; --warn-soft:#fbeed6; --danger:#b83227; --danger-soft:#fbe3e0;
  --ok:#1d8048; --ok-soft:#dcf1e3; --frame:#18222c; --shadow:0 30px 60px -30px rgba(20,40,60,.45);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Geeza Pro",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0c141c; --ink:#e5ebf0; --muted:#8d9cab; --surface:#17212b; --surface2:#1f2c39; --line:#2a3949;
  --tg:#4f9ff0; --tg-ink:#ffffff; --chat:#0f1a22; --bubble-me:#2b5278; --bubble:#1f2c39;
  --zajel:#4cc0a6; --zajel-soft:#163a33; --warn:#e3a54a; --warn-soft:#3a2c14; --danger:#ef6a5e; --danger-soft:#3e1f1c;
  --ok:#4bc37d; --ok-soft:#173826; --frame:#04080c; --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0c141c; --ink:#e5ebf0; --muted:#8d9cab; --surface:#17212b; --surface2:#1f2c39; --line:#2a3949;
  --tg:#4f9ff0; --tg-ink:#ffffff; --chat:#0f1a22; --bubble-me:#2b5278; --bubble:#1f2c39;
  --zajel:#4cc0a6; --zajel-soft:#163a33; --warn:#e3a54a; --warn-soft:#3a2c14; --danger:#ef6a5e; --danger-soft:#3e1f1c;
  --ok:#4bc37d; --ok-soft:#173826; --frame:#04080c; --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tg);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;flex-direction:column;gap:6px;max-width:66ch}
.eyebrow{font-size:12.5px;letter-spacing:.04em;color:var(--zajel);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(24px,4vw,34px);line-height:1.35;margin:0;text-wrap:balance}
h2.big{font-family:var(--f-display);font-size:clamp(20px,3vw,24px);margin:0;line-height:1.5}
header.top p{margin:0;color:var(--muted)}
.modes{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);padding:5px;border-radius:14px;align-self:flex-start;max-width:100%}
.modes button{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--zajel);color:#fff}

.stage{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:840px){.stage{grid-template-columns:minmax(0,1fr)}}

/* ===== الهاتف ===== */
.phone{width:100%;max-width:400px;height:800px;margin-inline:auto;border:10px solid var(--frame);border-radius:44px;
  background:var(--surface2);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:440px){.phone{height:740px;border-width:6px;border-radius:30px}}
.tg-bar{display:flex;align-items:center;gap:10px;padding:14px 12px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.tg-bar .x{min-width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--tg);font-size:14px;font-weight:600}
.tg-bar .ttl{flex:1;min-width:0;text-align:center}
.tg-bar .ttl b{display:block;font-size:15px}
.tg-bar .ttl small{color:var(--muted);font-size:12px}
.devsw{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:2px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.screen{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.screen::-webkit-scrollbar{width:0}

.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sec{font-size:12.5px;color:var(--muted);font-weight:600;padding-inline:4px;margin-top:2px;display:flex;justify-content:space-between;align-items:center}
.sec button{border:0;background:none;color:var(--tg);font-size:12.5px;font-weight:600;padding:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--danger);background:var(--danger-soft)}
.pill.info{color:var(--tg);background:color-mix(in srgb,var(--tg) 14%,transparent)}
.pill.off{color:var(--muted);background:var(--surface2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--zajel);border-radius:6px;transition:width .4s}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--danger)}
svg.i{width:20px;height:20px;flex:none}

.mac{background:var(--zajel);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mac .bar{background:rgba(255,255,255,.22)}.mac .bar>i{background:#fff}
.mac small{opacity:.88}
.mac h2{font-family:var(--f-display);font-size:18px;margin:0}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{border:0;background:var(--surface);border-radius:14px;padding:11px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.quick svg{width:22px;height:22px;color:var(--zajel)}

.approve{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.lvl{font-weight:700;font-size:12px}
.lvl.r{color:var(--danger)}.lvl.y{color:var(--warn)}.lvl.g{color:var(--ok)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px;background:var(--surface2);display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--tg);color:var(--tg-ink)}
.btn.g{background:var(--ok-soft);color:var(--ok)}
.btn.y{background:var(--warn-soft);color:var(--warn)}
.btn.r{background:var(--danger-soft);color:var(--danger)}

.list{background:var(--surface);border-radius:16px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.item[data-open],.item[data-nav],.item[data-sect],.item[data-file]{cursor:pointer}
.item:last-child{border-bottom:0}
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.tile svg{width:21px;height:21px}
.item .t{font-weight:600;font-size:14px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:12px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:transparent;padding:0}
.chk[aria-pressed="true"]{background:var(--tg);border-color:var(--tg);color:#fff}
.chk svg{width:14px;height:14px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:3px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:3px 12px;border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--zajel);border-color:var(--zajel);color:#fff}
.chip .c{font-size:11.5px;opacity:.75}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:10px;padding:3px;gap:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 2px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);font-weight:600}
.subtabs{display:flex;gap:4px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line);margin:-12px -12px 0;padding:0 8px;background:var(--surface)}
.subtabs::-webkit-scrollbar{height:0}
.subtabs button{flex:none;border:0;background:none;padding:10px 10px 8px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
.subtabs button[aria-pressed="true"]{color:var(--zajel);border-color:var(--zajel);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat small{color:var(--muted);font-size:12px}
.grid-more{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid-more button{border:0;background:transparent;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;line-height:1.35;text-align:center}
.grid-more .tile{width:44px;height:44px;border-radius:13px}
.back{border:0;background:none;color:var(--tg);font-weight:600;padding:0;align-self:flex-start;font-size:14px}

.lib{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.lib:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right .2s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{right:21px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none}
.tabs button{border:0;background:transparent;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--zajel);font-weight:600}
.badge{position:absolute;top:3px;right:calc(50% - 22px);background:var(--danger);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.main-btn{border:0;background:var(--tg);color:var(--tg-ink);font-weight:600;padding:13px;font-size:15px;margin:8px 10px;border-radius:12px;width:calc(100% - 20px)}
.main-btn:disabled{opacity:.45;cursor:default}
.mb-wrap{background:var(--surface);flex:none}

/* محادثة المساعد داخل التطبيق */
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-start;background:var(--bubble-me);border-end-start-radius:4px}
.bub.ai{align-self:flex-end;background:var(--surface);border-end-end-radius:4px}
.bub .who{display:block;font-size:11.5px;color:var(--zajel);font-weight:700}
.composer{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:8px 14px;outline:none}
.round{width:38px;height:38px;border-radius:50%;border:0;background:var(--tg);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.round.ghost{background:transparent;color:var(--muted)}
.round svg{width:19px;height:19px}

/* ===== وضع البوت ===== */
.topics{display:flex;gap:6px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.topics button{flex:none;border:0;border-radius:99px;padding:4px 12px;font-size:12.5px;background:var(--surface2);display:inline-flex;gap:6px;align-items:center}
.topics button[aria-pressed="true"]{background:var(--tg);color:#fff}
.chatbg{flex:1;overflow-y:auto;background:var(--chat);padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.chatbg::-webkit-scrollbar{width:0}
.m-wrap{display:flex;flex-direction:column;gap:4px;max-width:88%}
.m-wrap.bot{align-self:flex-end}
.m-wrap.me{align-self:flex-start}
.msg{padding:8px 11px 6px;border-radius:14px;font-size:14px;line-height:1.6;background:var(--bubble);box-shadow:0 1px 1px rgba(0,0,0,.08);word-break:break-word}
.me .msg{background:var(--bubble-me)}
.msg .tm{display:block;text-align:left;font-size:10.5px;color:var(--muted);margin-top:2px}
.msg b{font-weight:700}
.msg .hdr{display:block;font-weight:700;margin-bottom:2px}
.msg .ln{display:block}
.msg .ephem{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.kb{display:grid;gap:4px}
.kb .r{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.kb button{border:0;border-radius:9px;padding:7px 6px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--bubble) 70%,transparent);color:var(--ink);backdrop-filter:blur(4px)}
.kb button.g{background:var(--ok);color:#fff}.kb button.r{background:var(--danger);color:#fff}.kb button.b{background:var(--tg);color:#fff}
.filecard{display:flex;gap:10px;align-items:center}
.filecard .tile{width:42px;height:42px;border-radius:50%}
.replykb{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px 8px;background:var(--surface2);border-top:1px solid var(--line);flex:none}
.replykb button{border:0;background:var(--surface);border-radius:8px;padding:7px 2px;font-size:12.5px;box-shadow:0 1px 0 var(--line)}
.botinput{display:flex;gap:6px;align-items:center;padding:7px 8px;background:var(--surface);flex:none;position:relative}
.botinput input{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;outline:none}
.menubtn{border:0;background:var(--tg);color:#fff;border-radius:16px;padding:6px 12px;font-weight:600;font-size:13px;flex:none}
.slash{position:absolute;bottom:100%;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);max-height:330px;overflow-y:auto;box-shadow:0 -10px 24px -16px rgba(0,0,0,.4)}
.slash button{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:none;padding:9px 14px;text-align:right;border-bottom:1px solid var(--line)}
.slash code{font-family:ui-monospace,Menlo,monospace;color:var(--tg);font-size:13px;direction:ltr}
.slash span{color:var(--muted);font-size:13px}
.inline-res{position:absolute;bottom:100%;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);max-height:340px;overflow-y:auto}
.typing{font-size:12px;color:var(--muted)}

.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:10px 16px 18px;display:flex;flex-direction:column;gap:12px;max-height:86%;overflow:auto;animation:up .22s ease-out}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:16.5px;line-height:1.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.code{display:flex;gap:8px;justify-content:center;direction:ltr}
.code input{width:46px;height:52px;text-align:center;font-size:22px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.toast{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:99px;font-size:13px;z-index:9;max-width:90%;text-align:center}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* الصفحة الحقيقية تملأ الشاشة (لا إطار هاتف) وتتبع ألوان تيليجرام */
html,body{height:100%;margin:0}
body{padding:0;background:var(--surface2)}
.phone{width:100%;max-width:none;height:100dvh;border:0;border-radius:0;box-shadow:none;margin:0}
.tg-bar{padding-top:max(10px,env(safe-area-inset-top,0px))}
a.btn{text-decoration:none;color:var(--tg-ink)}
</style>
</head>

<div class="phone" id="phone" dir="rtl" lang="ar"></div>

const P = {

  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',

  term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 13a8 8 0 0 0 14.5 4.5L20 16M4 4v4h4M20 20v-4h-4"/>',

/* ---- الاتصال ---- */
async function api(op, args = {}, confirm = null) {
  const r = await fetch('/api', { method:'POST', headers:{'content-type':'application/json','x-init-data': TW ? TW.initData : ''},
    body: JSON.stringify({ device: S.device, op, args, confirm }) });
  let d; try { d = await r.json(); } catch (e) { d = { error: 'ردّ غير مفهوم من الوسيط' }; }
  return d;
}
/* يعيد البيانات، أو يفتح لوح التأكيد/الرمز بحسب ما يقرره الماك */
async function call(op, args = {}, then) {
  const d = await api(op, args);
  return settle(d, op, args, then);
}
function settle(d, op, args, then) {
  if (d.needs === 'confirm') { S.sheet = { kind:'yellow', op, args, token:d.token, label:d.label, summary:d.summary, then }; render(); return null; }
  if (d.needs === 'code') { S.sheet = { kind:'red', id:d.id, label:d.label, then }; render(); setTimeout(() => $('#c0') && $('#c0').focus(), 50); return null; }
  if (d.error) { say(d.error); return null; }
  if (d.approval) { say('طُلبت الموافقة. ستصلك بطاقة في البوت برمز على شاشة الماك.'); return null; }
  return d.data === undefined ? d : d.data;
}
let toastT;
function say(m) { S.toast = m; render(true); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ''; const t = $('.toast'); t && t.remove(); }, 3200); }

  if (S.tab === 'tg' && S.sub === 'search') { const n = S.sel.size; return { text: n ? `حمّل ${ar(n)} ${n===1?'ملفًا':n===2?'ملفين':'ملفات'} إلى الماك` : 'اختر ملفات للتحميل', dis: !n, act: 'get' }; }
  if (S.tab === 'tg' && S.sub === 'libs') return { text:'أضف قناة برابطها', act:'addlib' };
  if (S.tab === 'tg' && S.sub === 'inbox') { const n = (S.inbox||[]).filter(i => i.state === 'new').length; return n ? { text:`رتّب الكل (${ar(n)})`, act:'inboxall' } : null; }
  if (S.tab === 'tg' && S.sub === 'backup') return { text:'انسخ الآن', act:'backupnow' };
  if (S.tab === 'home' && !S.sect) return { text:'ابحث في تيليجرام', act:'gosearch' };
  return null;
}
function renderTg() {
  const views = {home:vHome, files:vFiles, assist:vAssist, tg:vTg, more:vMore};
  const mb = mainBtn(), composer = S.tab === 'assist';
  return `<div class="tg-bar"><span style="min-width:32px"></span>
    <div class="ttl"><b>زاجل</b><button class="devsw" data-dev>${ic('pc')} ${esc(S.device || '…')} ▾</button></div><span style="min-width:32px"></span></div>
    <div class="screen" id="screen">${views[S.tab]()}</div>
    ${composer ? `<div class="composer"><input id="ask" placeholder="اسأل زاجل أو اطلب منه شيئًا" aria-label="اسأل زاجل">${S.job ? `<button class="round" data-stop aria-label="أوقف">${ic('stop')}</button>` : `<button class="round" data-send aria-label="أرسل">${ic('send')}</button>`}</div>`
      : (mb && !(TW && TW.initData) ? `<div class="mb-wrap"><button class="main-btn" id="mainBtn" ${mb.dis?'disabled':''} data-mb="${mb.act}">${esc(mb.text)}</button></div>` : '')}
    <nav class="tabs">${TABS.map(([k,v,i]) => `<button data-go="${k}" ${S.tab===k?'aria-current="page"':''}>${ic(i)}${v}</button>`).join('')}</nav>`;
}
function sheetHtml() {
  const s = S.sheet; if (!s) return '';
  const wrap = (inner) => `<div class="sheet-bg" data-close><div class="sheet" role="dialog"><div class="grab"></div>${inner}</div></div>`;
  if (s.kind === 'yellow') return wrap(`<span class="lvl y">عملية صفراء</span><h3>${esc(s.label)}</h3><span class="muted">${esc(s.summary)}</span><div class="btns"><button class="btn pri" data-yes>نفّذ</button><button class="btn" data-closebtn>إلغاء</button></div>`);
  if (s.kind === 'red') return wrap(`<span class="lvl r">عملية حمراء</span><h3>${esc(s.label)}</h3><span class="muted">اكتب الرمز الظاهر الآن على شاشة الماك. لو أخذ أحد هاتفك فلن يستطيع التنفيذ دونه.</span>
    <div class="code">${[0,1,2,3].map(i => `<input id="c${i}" inputmode="numeric" maxlength="1" aria-label="الرقم ${i+1}">`).join('')}</div><span class="muted" id="codeMsg" aria-live="polite"></span><button class="btn pri" data-confirm style="padding:12px;justify-content:center">تأكيد</button>`);
  if (s.kind === 'add') return wrap(`<h3>${esc(s.title)}</h3><label class="search"><input id="newVal" placeholder="${esc(s.ph)}"></label><button class="btn pri" data-addok style="padding:12px;justify-content:center">أضف</button>`);
  if (s.kind === 'dev') return wrap(`<h3>اختر الجهاز</h3><div class="list">${S.devices.map(d => item(`${tile('pc', d.online ? '#0d6b5b' : '#5a6877')}<div class="grow"><div class="t">${esc(d.name)}</div><div class="m">${d.online ? 'متصل' : 'غير متصل'}</div></div>${S.device===d.name?'<span class="pill ok">مختار</span>':''}`, `data-setdev="${esc(d.name)}"`)).join('')}</div>`);
  if (s.kind === 'file') return wrap(`<div class="row">${tile('file','#5a6877')}<h3 class="grow">${esc(s.name)}</h3></div><div class="btns"><button class="btn g" data-sendfile>أرسله إلى تيليجرام</button><button class="btn r" data-delfile>احذفه</button></div>`);
  if (s.kind === 'item') { const it = (S.res ? S.res.items : []).find(i => i.ref === s.ref); if (!it) return '';
    return wrap(`<div class="row">${tile(it.t, TCOL[it.t]||'#5a6877')}<h3 class="grow">${esc(it.title)}</h3></div><dl class="kv"><dt>القناة</dt><dd>${esc(it.lib_name)}</dd><dt>النوع</dt><dd>${esc(it.meta)}</dd><dt>الحجم</dt><dd class="num">${esc(it.size_h)}</dd><dt>نُشر</dt><dd>${esc(it.date)}</dd></dl>
    <div class="btns">${it.t === 'link' ? `<a class="btn pri" href="${esc(it.link)}" target="_blank" rel="noopener">افتح الرابط</a>` : `<button class="btn pri" data-get1="${esc(it.ref)}">حمّل إلى الماك</button>`}
    ${it.t === 'audio' ? `<button class="btn g" data-get1="${esc(it.ref)}" data-then="transcribe">حمّل وفرّغ</button>` : ''}${it.t === 'book' ? `<button class="btn g" data-get1="${esc(it.ref)}" data-then="kindle">حمّل وأرسل إلى كيندل</button>` : ''}</div>`); }
  return '';
}
function render(keep) {
  const ph = $('#phone'); const sc = $('#screen'); const top = sc ? sc.scrollTop : 0;
  const fid = document.activeElement && document.activeElement.id; const caret = document.activeElement && 'selectionStart' in document.activeElement ? document.activeElement.selectionStart : null;
  ph.innerHTML = renderTg() + sheetHtml() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  const n = $('#screen'); if (n) { if (S.tab === 'assist') n.scrollTop = n.scrollHeight; else if (keep) n.scrollTop = top; }
  if (fid && ['q','ask','fq','mq','newVal'].includes(fid)) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  syncMain();
}
function syncMain() {
  if (!TW || !TW.initData) return; const mb = mainBtn(), B = TW.MainButton;
  if (!mb || S.tab === 'assist') { B.hide(); return; }
  B.setText(mb.text); mb.dis ? B.disable() : B.enable(); B.show(); B.offClick(mbClick); B.onClick(mbClick);
}
const mbClick = () => { const mb = mainBtn(); mb && doMain(mb.act); };

/* ---- تحميل البيانات ---- */
const load = {
  home: async () => { S.home = await call('home'); },
  files: async () => { if (S.place) { const r = await call('files.list', { place:S.place, path:S.path }); S.entries = r ? (r.entries || []) : []; } else { const r = await call('files.places'); S.places = r ? (r.places || r) : []; } },
  assist: async () => { if (!S.agents.length) { S.agents = await call('assist.agents') || []; S.agent = (S.agents.find(a => a.installed) || {}).id || ''; } },
  more: async () => { if (!S.groups) S.groups = await call('more.list'); if (S.sect) S.sectData = await call('more.section', { key:S.sect }); },
  tg: async () => { const m = { libs:'tg.libs', inbox:'tg.inbox', watch:'tg.watch', backup:'tg.backup', dls:'tg.dls' }[S.sub]; if (!m) return; const r = await call(m); if (r === null) return;
    if (S.sub === 'libs') S.libs = r; else if (S.sub === 'inbox') S.inbox = r; else if (S.sub === 'watch') S.watch = r; else if (S.sub === 'backup') S.backup = r; else S.dls = r; }
};
const refresh = guard(async (keep) => { await (load[S.tab] || (async () => {}))(); render(keep); });

/* ---- الأحداث ---- */
async function runSearch() {
  if (!S.q.trim()) return;
  say('أبحث…'); const r = await call('tg.search', { q:S.q, scope:S.scope, type:'all' }); if (r) { S.res = r; S.sel.clear(); } S.toast = ''; render();
}
async function doMain(act) {
  if (act === 'gosearch') { S.tab = 'tg'; S.sub = 'search'; return render(); }
  if (act === 'get') { const refs = [...S.sel]; for (const ref of refs) await call('tg.get', { ref }); S.sel.clear(); S.sub = 'dls'; say(`بدأ تنزيل ${ar(refs.length)} على الماك`); return refresh(); }
  if (act === 'addlib') { S.sheet = { kind:'add', title:'أضف قناة', ph:'رابط القناة أو اسمها', mode:'lib', list:'fiqh' }; return render(); }
  if (act === 'inboxall') { const r = await call('tg.inbox_apply'); if (r) say('رُتّب الوارد كله'); return refresh(); }
  if (act === 'backupnow') { const r = await call('tg.backup_now', {}, () => say('بدأ نسخ المحادثات على الماك')); if (r) say('بدأ نسخ المحادثات على الماك'); }
}
document.addEventListener('click', guard(async e => {
  const t = e.target.closest('button,[data-open],[data-close],[data-place],[data-dir],[data-file],[data-sect],[data-go],[data-setdev],a'); if (!t) return; const d = t.dataset;
  if ('close' in d) { if (e.target !== t) return; S.sheet = null; return render(true); }
  if ('closebtn' in d) { S.sheet = null; return render(true); }
  if (d.go) { S.tab = d.go; S.sect = null; S.sectData = null; if (d.sub) S.sub = d.sub; if (d.go === 'files') { S.place = null; S.path = ''; S.entries = null; } render(); return refresh(); }
  if (d.sub && !d.go) { S.sub = d.sub; render(); return refresh(); }
  if (d.sect) { S.sect = d.sect; S.sectData = null; if (S.tab !== 'more' && S.tab !== 'home') S.tab = 'more'; if (S.tab === 'home') { S.tab = 'more'; } render(); return refresh(); }
  if ('back' in d) { S.sect = null; S.sectData = null; return render(); }
  if ('refresh' in d) return refresh(true);
  if (d.act) { const r = await call(d.act, {}, () => refresh(true)); if (r) say('تم'); return; }
  if (d.scope) { S.scope = d.scope; return S.q ? runSearch() : render(true); }
  if (d.type) { S.type = d.type; return render(true); }
  if (d.sel) { e.stopPropagation(); S.sel.has(d.sel) ? S.sel.delete(d.sel) : S.sel.add(d.sel); return render(true); }
  if (d.open) { S.sheet = { kind:'item', ref:d.open }; return render(true); }
  if ('get1' in d) { const r = await call('tg.get', { ref:d.get1, then:d.then || '' }); S.sheet = null; if (r) say('بدأ التنزيل على الماك'); return render(true); }
  if (d.lib) { const l = S.libs.libs.find(x => String(x.id) === d.lib); await call('tg.lib_toggle', { id:l.id, on:!l.on }); return refresh(true); }
  if (d.word) { await call('tg.watch_toggle', { id:d.word }); return refresh(true); }
  if (d.bk) { const b = S.backup.chats.find(x => String(x.id) === d.bk); await call('tg.backup_toggle', { id:b.id, name:b.name, on:!b.on }); return refresh(true); }
  if ('suggest' in d) { say('أبحث عن قنوات…'); S.sug = await call('tg.suggest', { q:S.q || 'فقه' }) || []; S.toast = ''; return render(true); }
  if (d.addsug) { const s = S.sug[+d.addsug]; const r = await call('tg.lib_add', { ref:s.username, list:'fiqh' }); S.sug.splice(+d.addsug, 1); if (r) say('أُضيفت إلى «كتب شرعية»'); return refresh(true); }
  if (d.addlib) { S.sheet = { kind:'add', title:'أضف قناة إلى «' + LISTS[d.addlib] + '»', ph:'رابط القناة أو اسمها', mode:'lib', list:d.addlib }; render(); return $('#newVal') && $('#newVal').focus(); }
  if ('addword' in d) { S.sheet = { kind:'add', title:'أضف كلمة إلى المراقب', ph:'مثل: تحقيق جديد', mode:'word' }; render(); return $('#newVal') && $('#newVal').focus(); }
  if ('addbk' in d) { const c = await call('tg.backup_candidates'); if (!c) return; const first = c.find(x => !S.backup.chats.some(b => b.id === x.id)); if (!first) return say('لا محادثات أخرى'); S.sheet = { kind:'add', title:'اكتب اسم المحادثة كما تراه في تيليجرام', ph:'مثل: مجموعة الطلاب', mode:'bk', cands:c }; return render(); }
  if ('addok' in d) { const v = ($('#newVal').value || '').trim(); if (!v) return $('#newVal').focus(); const sh = S.sheet; S.sheet = null;
    if (sh.mode === 'word') await call('tg.watch_add', { word:v }); else if (sh.mode === 'lib') await call('tg.lib_add', { ref:v, list:sh.list || 'fiqh' });
    else { const c = sh.cands.find(x => norm(x.name).includes(norm(v))); if (!c) say('لم أجد محادثة بهذا الاسم'); else await call('tg.backup_toggle', { id:c.id, name:c.name, on:true }); }
    return refresh(); }
  if (d.cancel) { await call('tg.cancel', { id:d.cancel }); return refresh(true); }
  if (d.place) { S.place = d.place; S.path = ''; S.entries = null; render(); return refresh(); }
  if (d.dir) { S.path = d.dir; S.entries = null; render(); return refresh(); }
  if ('up' in d) { if (S.path) { S.path = S.path.split('/').slice(0, -1).join('/'); } else { S.place = null; } S.entries = null; render(); return refresh(); }
  if (d.file) { S.sheet = { kind:'file', path:d.file, name:d.name }; return render(true); }
  if ('sendfile' in d) { const r = await call('files.send', { place:S.place, path:S.sheet.path }); S.sheet = null; if (r) say('أُرسل الملف إلى محادثتك في تيليجرام'); return render(true); }
  if ('delfile' in d) { const p = S.sheet.path; S.sheet = null; await call('files.delete', { place:S.place, items:[p] }); return render(true); }
  if (d.agent) { S.agent = d.agent; return render(true); }
  if (d.ask) return ask(d.ask);
  if ('send' in d) { const v = ($('#ask').value || '').trim(); if (v) ask(v); return; }
  if ('stop' in d) { if (S.job) await call('assist.stop', { job:S.job }); S.job = null; return render(true); }
  if ('dev' in d) { S.devices = (await call('device.list') || {}).devices || []; S.sheet = { kind:'dev' }; return render(true); }
  if (d.setdev) { S.device = d.setdev; S.sheet = null; S.home = null; say('صرت تتحكم في ' + d.setdev); render(); return refresh(); }
  if (d.approve) { await call('approvals.approve', { id:d.approve }, () => refresh()); return; }
  if (d.reject) { await call('approvals.reject', { id:d.reject }); return refresh(); }
  if ('yes' in d) { const s = S.sheet; S.sheet = null; const r = await api(s.op, s.args, s.token); render(); const out = settle(r, s.op, s.args, s.then); if (out !== null) { say('بدأ التنفيذ على الماك'); if (s.then) s.then(); } return; }
  if ('confirm' in d) { const code = [0,1,2,3].map(i => $('#c'+i).value).join(''); const r = await api('red.confirm', { id:S.sheet.id, code });
    if (r.error) { if (/انتهت|ثلاث/.test(r.error)) { S.sheet = null; render(); return say(r.error); } $('#codeMsg').textContent = r.error; return; }
    const then = S.sheet.then; S.sheet = null; render(); say('تم على الماك'); return then && then(); }
  if (d.mb) return doMain(d.mb);
}));
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') S.q = e.target.value;
  else if (/^c\d$/.test(id) && e.target.value) { const nx = $('#c' + (+id[1] + 1)); if (nx) nx.focus(); }
  else if (id === 'mq') { const v = norm(e.target.value); document.querySelectorAll('.grid-more button').forEach(b => b.hidden = v && !norm(b.textContent).includes(v)); }
});
document.addEventListener('keydown', guard(async e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'q') { e.preventDefault(); e.target.blur(); return runSearch(); }
  if (e.target.id === 'ask') { e.preventDefault(); const v = e.target.value.trim(); if (v) ask(v); }
}));
async function ask(q) {
  if (S.job) return;
  S.chat.push({ me:true, text:q }); const m = { me:false, who:'زاجل', text:'' }; S.chat.push(m); render();
  const r = await call('assist.ask', { q, agent:S.agent }); if (!r) { S.chat.pop(); S.chat.pop(); return render(); }
  m.who = r.agent; S.job = r.job; render();
  const t0 = Date.now();
  while (S.job === r.job && Date.now() - t0 < 20 * 60 * 1000) {            // بثّ تدريجي: الجواب يكبر في مكانه
    await new Promise(ok => setTimeout(ok, 1200));
    const p = await call('assist.poll', { job:r.job }); if (!p) break;
    m.text = p.text || (p.step ? '… ' + p.step : '…');
    if (p.state !== 'running') { if (p.state === 'stopped') m.text += ' …(أُوقف)'; else if (p.error && !p.text) m.text = p.error; break; }
    render(true);
  }
  S.job = null; render(true);
}
/* التنزيلات والوارد تتحدث وحدها */
setInterval(() => { if (!document.hidden && S.tab === 'tg' && S.sub === 'dls' && !S.sheet) refresh(true); }, 4000);

/* الثيم من تيليجرام */
if (TW && TW.colorScheme) document.documentElement.dataset.theme = TW.colorScheme;
(async () => {
  render();
  const d = await call('device.list');
  if (d) { S.devices = d.devices; S.device = d.target || (d.devices[0] && d.devices[0].name); }
  S.home = null; render(); await refresh();
})();

</script>
</body>
</html>
